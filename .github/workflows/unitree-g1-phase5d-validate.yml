name: Validate Unitree G1 Phase 5D

on:
  push:
    branches: [main, "fix/**", "claude/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unitree-g1-phase5d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unitree G1 Phase 5D syntax contracts
        run: |
          node --check src/physics/backend-contract.js
          node --check src/physics/session.js
          node --check src/physics/browser-mujoco-backend.js
          node --check src/physics/model-registry.js
          node --check src/physics/capabilities.js
          node --check src/physics/unitree-g1-source-audit.js
          node --check src/physics/unitree-g1-controller.js
          node --check src/physics/unitree-g1-model-package.js
          node --check src/physics/unitree-g1-capabilities.js
          node --check src/physics/unitree-g1-scene.js
          node --check src/physics/unitree-g1-mujoco-worker.js
          node --check src/physics/unitree-g1-physical-simulator.js
          node --check src/webmcp/unitree-g1-physical-control.js
          node --check src/webmcp/robot-controls.js
          node --check src/webmcp/register-ide-tools.js
          node --check src/runtime/live-python-bridge.js
          node --check src/runtime/live-python-worker.js
          node --check src/runtime/physical-python-runtime.js
          node --check src/simulator-host.js
          node --check src/task-catalog.js
          node --check src/task-workspace.js
          node --check src/profiles.js
          node --check src/app-v2.js
          node --check tests/physics/unitree-g1-phase5d-core.mjs
          node --check tests/unitree-g1-conformance-browser.spec.mjs
          node --check tests/unitree-g1-phase5d-browser.spec.mjs
          node --check tests/unitree-g1-presentation-browser.spec.mjs
          node --check tests/webmcp-robot-controls.spec.mjs
          node --check playwright.config.mjs
          python -m py_compile scripts/prepare_unitree_g1_assets.py scripts/generate_unitree_g1_models.py
          python -m py_compile native/unitree_g1_reference.py tests/validate_unitree_g1_controller_parity.py tests/validate_unitree_g1_evidence.py

      - name: Pinned source and mesh assets match their recorded hashes
        run: python scripts/prepare_unitree_g1_assets.py

      - name: Committed MJCF assets match the deterministic generator
        run: python scripts/generate_unitree_g1_models.py --check

      - name: Shared physics session, backend and sampled-observation contracts
        run: node tests/physics/vertical-slice-core.mjs

      - name: Unitree G1 source audit, controller, model package, capability and WebMCP contracts
        run: node tests/physics/unitree-g1-phase5d-core.mjs

      - name: Independent G1 review regressions and shipped WASM worker
        run: |
          node tests/physics/session-epoch-publication-core.mjs
          node tests/physics/unitree-g1-frames-core.mjs
          node tests/physics/unitree-g1-worker-review.mjs

      - name: Repository static fidelity checks
        run: node tests/validate.mjs

      - name: Install native MuJoCo
        run: python -m pip install --disable-pip-version-check --no-cache-dir "mujoco==3.11.0" numpy

      - name: JavaScript and native low-level motor law agree exactly
        run: |
          python tests/validate_unitree_g1_controller_parity.py
          python tests/validate_unitree_g1_frames.py

      - name: Generate native Unitree G1 physical, negative and sensitivity evidence
        run: |
          mkdir -p /tmp/unitree-g1-evidence
          cd "$GITHUB_WORKSPACE"
          run() { python native/unitree_g1_reference.py --trial "$1" "${@:3}" > "/tmp/unitree-g1-evidence/unitree-g1-$2.json"; }
          run model-audit model-audit
          run mounted-joint-response mounted-joint-response
          run blocked-joint blocked-joint
          run known-poses known-poses
          run command-bounds command-bounds
          run free-fall free-fall
          run self-contact self-contact
          run external-object external-object
          run stand-nominal stand-nominal
          run stand-source-fixstand stand-source-fixstand
          run stand-motors-disabled stand-motors-disabled
          run stand-low-friction stand-low-friction
          run stand-perturbation stand-perturbation --impulse 0.15
          run stand-perturbation stand-perturbation-over --impulse 0.20
          run stand-nominal stand-nominal-tight --timestep 0.001 --control-interval 0.001
          run free-fall free-fall-tight --timestep 0.001
          run mounted-joint-response mounted-joint-response-tight --timestep 0.001 --control-interval 0.001
          run blocked-joint blocked-joint-tight --timestep 0.001 --control-interval 0.001

      - name: Retain native Unitree G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unitree-g1-phase5d-native-evidence-${{ github.sha }}
          path: /tmp/unitree-g1-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate the native physical, negative and sensitivity gates
        run: python tests/validate_unitree_g1_evidence.py /tmp/unitree-g1-evidence

      - name: Fleet regressions must not be weakened by Phase 5D
        run: |
          node tests/physics/model-registry-core.mjs
          node tests/physics/so101-manipulation-core.mjs
          node tests/physics/so101-task-evaluator-core.mjs
          node tests/physics/openarm-phase5a-core.mjs
          node tests/physics/lekiwi-phase5b-core.mjs
          node tests/physics/microduck-phase5c-core.mjs
          node tests/physics/microduck-lifecycle-core.mjs
          node tests/physics/live-python-bridge-core.mjs
          node tests/physics/physical-python-runtime-core.mjs
          node tests/webmcp-core.mjs
          node tests/validate_canonical_visuals.mjs
          python tests/validate_starters.py
          python tests/execute_starters.py

      - name: Unitree G1 browser conformance, IDE journey and presentation regressions
        env:
          UNITREE_G1_NATIVE_REPORT_DIR: /tmp/unitree-g1-evidence
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tests/unitree-g1-conformance-browser.spec.mjs tests/unitree-g1-phase5d-browser.spec.mjs tests/unitree-g1-presentation-browser.spec.mjs tests/webmcp-robot-controls.spec.mjs tests/webmcp.spec.mjs --reporter=line

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unitree-g1-phase5d-browser-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
