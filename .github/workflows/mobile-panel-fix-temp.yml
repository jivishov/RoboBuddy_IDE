name: Fix mobile diagnostics row
on:
  push:
    branches: [fix/ide-layout-activity-front-view]
    paths: [.github/workflows/mobile-panel-fix-temp.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ide-layout-activity-front-view
      - name: Patch mobile grid and regression
        shell: python
        run: |
          from pathlib import Path
          p=Path('styles.css'); s=p.read_text(); old='.app{grid-template-rows:35px 42px minmax(0,1fr) auto 24px}.statusbar'; new='.app{grid-template-rows:35px 42px minmax(0,1fr) var(--bottom-row) 24px}.statusbar'
          if old not in s: raise SystemExit('mobile app grid override not found')
          p.write_text(s.replace(old,new,1))
          p=Path('tests/browser-smoke.spec.mjs'); s=p.read_text(); marker="  expect(Math.abs(layout.workspaceBottom - layout.panelTop)).toBeLessThanOrEqual(1);\n});"
          repl="""  expect(Math.abs(layout.workspaceBottom - layout.panelTop)).toBeLessThanOrEqual(1);\n\n  await page.setViewportSize({ width: 390, height: 740 });\n  await page.locator('[data-side-view=\"task\"]').click();\n  await expect(page.locator('#taskSideView')).toBeVisible();\n  await page.locator('#bottomClose').click();\n  await page.locator('#panelToggle').click();\n  const mobile = await page.evaluate(() => {\n    const panel = document.getElementById('bottomPanel').getBoundingClientRect();\n    const editor = document.querySelector('.editor-pane').getBoundingClientRect();\n    return { panelLeft: panel.left, panelRight: panel.right, panelTop: panel.top, editorBottom: editor.bottom, viewportWidth: innerWidth };\n  });\n  expect(mobile.panelLeft).toBeLessThanOrEqual(1);\n  expect(mobile.panelRight).toBeGreaterThanOrEqual(mobile.viewportWidth - 1);\n  expect(mobile.editorBottom).toBeLessThanOrEqual(mobile.panelTop + 1);\n});"""
          if marker not in s: raise SystemExit('browser layout test marker not found')
          p.write_text(s.replace(marker,repl,1))
      - run: |
          node --check tests/browser-smoke.spec.mjs
          git diff --check
      - name: Commit and remove one-use workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css tests/browser-smoke.spec.mjs
          git rm .github/workflows/mobile-panel-fix-temp.yml
          git commit -m "fix: reserve diagnostics row on mobile"
          git push origin HEAD:fix/ide-layout-activity-front-view
