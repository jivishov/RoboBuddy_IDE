name: Fix OpenArm true front camera

on:
  push:
    branches:
      - fix/openarm-true-front-camera
    paths:
      - ".github/workflows/openarm-front-camera-fix-temp.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct OpenArm front-view azimuth and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/source-simulator.js')
          text = path.read_text()
          old_comment = '''// Front-view directions are derived from the canonical RoboBuddy_AI camera presets
          // at the pinned robot-model revision. We reuse their direction while fitting the
          // complete current task bounds so load/reset shows the robot from its intended front.
          '''
          new_comment = '''// SO-101 and LeKiwi reuse their pinned RoboBuddy_AI inspection-camera directions.
          // RoboBuddy_AI's OpenArm inspection preset is rear-facing relative to the bimanual
          // workcell. For the IDE's semantic Front / Fit View we mirror that azimuth 180 degrees
          // around the same target while preserving its elevation and camera-target distance.
          '''
          if old_comment not in text:
              raise SystemExit('expected front-camera comment block not found')
          text = text.replace(old_comment, new_comment, 1)
          old = "  openarm: Object.freeze({ position: [-1550, 820, 0], target: [140, 365, 0] }),"
          new = "  openarm: Object.freeze({ position: [1830, 820, 0], target: [140, 365, 0] }),"
          if old not in text:
              raise SystemExit('expected OpenArm rear camera preset not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/browser-smoke.spec.mjs')
          source = test.read_text()
          old_test = "  expect(presets.openarm).toEqual({ position: [-1550, 820, 0], target: [140, 365, 0] });"
          new_test = "  expect(presets.openarm).toEqual({ position: [1830, 820, 0], target: [140, 365, 0] });\n  expect(presets.openarm.position[0]).toBeGreaterThan(presets.openarm.target[0]);"
          if old_test not in source:
              raise SystemExit('expected OpenArm camera regression assertion not found')
          test.write_text(source.replace(old_test, new_test, 1))
          PY
          node --check src/source-simulator.js
          node --check tests/browser-smoke.spec.mjs
          git diff --check

      - name: Run focused and full browser validation
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/openarm-front-camera-fix-temp.yml
          git add src/source-simulator.js tests/browser-smoke.spec.mjs
          git commit -m "fix: show OpenArm from true front"
          git push origin HEAD:fix/openarm-true-front-camera
