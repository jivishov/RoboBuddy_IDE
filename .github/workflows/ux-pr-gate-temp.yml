name: Validate IDE UX fixes
on:
  push:
    branches: [fix/ide-layout-activity-front-view]
    paths: [.github/workflows/ux-pr-gate-temp.yml]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ide-layout-activity-front-view
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static checks
        run: |
          node --check src/app-v2.js
          node --check src/source-simulator.js
          node --check tests/browser-smoke.spec.mjs
          node tests/validate.mjs
          node tests/validate_canonical_visuals.mjs
          node tests/validate_task_patch.mjs
          python tests/validate_starters.py
          python tests/execute_starters.py
          python tests/validate_openarm_reference.py
      - name: Browser checks
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Remove one-use workflow after passing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ux-pr-gate-temp.yml
          git commit -m "chore: remove one-use UX validation gate"
          git push origin HEAD:fix/ide-layout-activity-front-view
