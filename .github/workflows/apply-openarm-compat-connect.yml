name: Apply source plant compatibility connection

on:
  push:
    branches: [fix/latest-patch-tasks-runtime]
    paths: [.github/workflows/apply-openarm-compat-connect.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-patch-tasks-runtime
          fetch-depth: 0
      - name: Apply exact compatibility connection patch
        shell: python
        run: |
          from pathlib import Path

          sim = Path('src/source-simulator.js')
          text = sim.read_text()
          old = "      this.engine.plant.connect(this.connectedInstance, { cameras: {} });"
          new = """      const connectionConfig = this.profileId === 'openarm'\n        ? { kind: 'bimanual', side: 'bimanual', cameras: {} }\n        : { cameras: {} };\n      this.engine.plant.connect(this.connectedInstance, connectionConfig);"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one source-simulator connect site, found {text.count(old)}')
          sim.write_text(text.replace(old, new))

          test = Path('tests/browser-smoke.spec.mjs')
          text = test.read_text()
          old = "        engine.plant.connect(instanceId, { cameras: {} });"
          new = """        const connectionConfig = profileId === 'openarm'\n          ? { kind: 'bimanual', side: 'bimanual', cameras: {} }\n          : { cameras: {} };\n        engine.plant.connect(instanceId, connectionConfig);"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one browser test connect site, found {text.count(old)}')
          test.write_text(text.replace(old, new))

          workflow = Path('.github/workflows/apply-openarm-compat-connect.yml')
          workflow.unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: connect OpenArm source plant as physical bimanual profile"
          git push origin HEAD:fix/latest-patch-tasks-runtime
