name: Apply support-pad depth separation fix

on:
  push:
    branches: ["fix/support-pad-z-fighting"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-pad-z-fighting
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply render-only z-fighting fix and regression guard
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/source-simulator.js")
          text = source.read_text()
          old = """    const floor = new THREE.Mesh(new THREE.CircleGeometry(980, 96), new THREE.MeshStandardMaterial({ color: 0x17212b, roughness: 0.95 }));\n    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; this.scene.add(floor);"""
          new = """    // Several reviewed work-surface proxies intentionally have their top face at y=0,\n    // the same geometric plane as this presentation-only ground disk. Rendering both at\n    // identical depth causes camera-angle-dependent z-fighting. Keep all authored\n    // collision/support geometry untouched and bias only the decorative ground depth.\n    const floorMaterial = new THREE.MeshStandardMaterial({\n      color: 0x17212b,\n      roughness: 0.95,\n      polygonOffset: true,\n      polygonOffsetFactor: 1,\n      polygonOffsetUnits: 4,\n    });\n    const floor = new THREE.Mesh(new THREE.CircleGeometry(980, 96), floorMaterial);\n    floor.name = 'presentation-ground-depth-biased';\n    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; this.scene.add(floor);"""
          if old not in text:
              raise SystemExit("expected floor block not found")
          source.write_text(text.replace(old, new, 1))

          test = Path("tests/validate_task_patch.mjs")
          t = test.read_text()
          marker = "console.log('pinned latest task patch + physical action visibility: OK');"
          guard = """for (const token of [\n  \"floor.name = 'presentation-ground-depth-biased'\",\n  'polygonOffset: true',\n  'polygonOffsetFactor: 1',\n  'polygonOffsetUnits: 4',\n]) {\n  if (!sourceSimulator.includes(token)) throw new Error(`presentation ground is missing z-fighting guard ${token}`);\n}\n\n"""
          if marker not in t:
              raise SystemExit("validate_task_patch marker not found")
          test.write_text(t.replace(marker, guard + marker, 1))
      - name: Focused validation
        run: |
          node --check src/source-simulator.js
          node tests/validate.mjs
          node tests/validate_task_patch.mjs
      - name: Commit clean patch
        run: |
          rm .github/workflows/fix-support-pad-z-fighting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/source-simulator.js tests/validate_task_patch.mjs .github/workflows/fix-support-pad-z-fighting.yml
          git commit -m "fix: prevent support-pad z-fighting"
          git push origin HEAD:fix/support-pad-z-fighting
