name: Validate General Laboratory Scene Builder
on:
  push:
    branches: [main, feat/openarm-general-scene-builder]
  pull_request:
    paths:
      - 'src/physics/openarm-*'
      - 'src/webmcp/openarm-*'
      - 'src/webmcp/register-ide-tools.js'
      - 'src/ui/general-lab-builder.js'
      - 'tests/*general*'
      - 'tests/physics/*general*'
      - 'tests/fixtures/general-scenes/**'
      - '.github/workflows/openarm-general-scene-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: general-scene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'jivishov/RoboBuddy_IDE'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Retain the exact tracked source for independent reproduction
        run: |
          mkdir -p "$RUNNER_TEMP/general-scene-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/general-scene-source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/general-scene-source/identity.txt"
          cd "$RUNNER_TEMP/general-scene-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: general-laboratory-source
          path: ${{ runner.temp }}/general-scene-source/
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-package-lock
      - run: python -m pip install jsonschema==4.25.1
      - name: Contracts, actual shipped MuJoCo and negative controls
        run: |
          node tests/physics/openarm-phase5a-core.mjs
          node tests/physics/openarm-worker.mjs
          node tests/physics/openarm-general-contracts.mjs
          node tests/physics/openarm-general-scene.mjs
          node tests/physics/openarm-general-review.mjs
          python tests/validate_openarm_schemas.py
          python tests/validate_general_scene_schemas.py
          mkdir -p general-scene-evidence
          cp test-results/openarm-general-*.json general-scene-evidence/
          printf '%s\n' "$GITHUB_SHA" > general-scene-evidence/source-commit.txt
      - run: npx playwright install --with-deps chromium
      - name: Registered tools, real browser physics, human review and regressions
        run: npx playwright test tests/openarm-general-scene-browser.spec.mjs tests/openarm-workcell-browser.spec.mjs tests/webmcp.spec.mjs --workers=1
      - name: Verification does not rewrite source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-laboratory-scene-evidence
          path: |
            test-results/
            general-scene-evidence/
          retention-days: 14
