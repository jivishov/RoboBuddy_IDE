name: SO-101 hardware software checks
on:
  push:
    branches: [main, "fix/so101-hardware-panel"]
  pull_request:
    paths: ["hardware*", "hardware_bridge/**", "src/hardware/**", "tests/hardware/**", "*RoboBuddy-Hardware*", "ide.html", ".github/workflows/so101-hardware.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hardware_bridge/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CPU runtime
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Pinned motor driver
        run: python -m pip install -r hardware_bridge/requirements.txt
      - name: Published SDK source for reproducible offline setup
        if: runner.os == 'Windows'
        run: |
          python -c "import base64,hashlib,urllib.request; d=urllib.request.urlopen('https://files.pythonhosted.org/packages/5f/8e/c53d6f9a8bf3a86a635b58eeb675723f1b040f1665a0681467756c8989aa/feetech-servo-sdk-1.0.0.tar.gz',timeout=30).read(); assert hashlib.sha256(d).hexdigest()=='d4d3832e4b1b22a8222133a414db9f868224c2fb639426a1b11d96ddfe84e69c'; print('FEETECH_SDK_SDIST_BASE64='+base64.b64encode(d).decode())"
      - name: Real driver API check without USB
        run: python -m hardware_bridge.check_driver
      - name: Controller, transport, security and real driver adapter
        run: python -m unittest discover -s tests/hardware -v
      - name: Visual mapping and endpoint isolation
        run: node tests/hardware/joint-map-core.mjs
      - name: JavaScript syntax
        shell: bash
        run: |
          for file in src/hardware/*.js; do node --check "$file"; done
      - name: Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('Start-RoboBuddy-Hardware.ps1','Setup-RoboBuddy-Hardware.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Demo panel browser check; never opens USB
        run: npx playwright test --config playwright.hardware.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: so101-hardware-panel-evidence
          path: test-results/

