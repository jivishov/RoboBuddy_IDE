name: Apply LeKiwi true front camera

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lekiwi-front-camera-fix-temp.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply LeKiwi front-camera correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/source-simulator.js')
          text = source.read_text()
          old_comment = "// SO-101 and LeKiwi reuse their pinned RoboBuddy_AI inspection-camera directions.\n// RoboBuddy_AI's OpenArm inspection preset is rear-facing relative to the bimanual\n// workcell. For the IDE's semantic Front / Fit View we mirror that azimuth 180 degrees\n// around the same target while preserving its elevation and camera-target distance."
          new_comment = "// SO-101 reuses its pinned RoboBuddy_AI inspection-camera direction.\n// The pinned LeKiwi and OpenArm inspection presets are rear-facing relative to the\n// robot/workcell presentation. For the IDE's semantic Front / Fit View we mirror each\n// rear-facing azimuth 180 degrees around the same target while preserving elevation\n// and camera-target distance."
          if old_comment not in text:
              raise SystemExit('expected camera comment not found')
          text = text.replace(old_comment, new_comment, 1)

          old = "lekiwi: Object.freeze({ position: [-620, 350, 240], target: [-60, 125, 45] }),"
          new = "lekiwi: Object.freeze({ position: [500, 350, -150], target: [-60, 125, 45] }),"
          if old not in text:
              raise SystemExit('expected LeKiwi camera preset not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/browser-smoke.spec.mjs')
          text = test.read_text()
          old = "expect(presets.lekiwi).toEqual({ position: [-620, 350, 240], target: [-60, 125, 45] });"
          new = "expect(presets.lekiwi).toEqual({ position: [500, 350, -150], target: [-60, 125, 45] });\n  expect(presets.lekiwi.position[0]).toBeGreaterThan(presets.lekiwi.target[0]);\n  expect(presets.lekiwi.position[2]).toBeLessThan(presets.lekiwi.target[2]);"
          if old not in text:
              raise SystemExit('expected LeKiwi browser assertion not found')
          test.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -F "lekiwi: Object.freeze({ position: [500, 350, -150], target: [-60, 125, 45] })" src/source-simulator.js

      - name: Validate corrected build
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/app-v2.js
          node --check src/editor.js
          node --check src/profiles.js
          node --check src/python-runtime.js
          node --check src/canonical-rig.js
          node --check src/simulator.js
          node --check src/source-simulator.js
          node --check src/task-catalog.js
          node --check src/task-workspace.js
          node tests/validate.mjs
          node tests/validate_canonical_visuals.mjs
          node tests/validate_task_patch.mjs
          python tests/validate_starters.py
          python tests/execute_starters.py
          python tests/validate_openarm_reference.py
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lekiwi-front-camera-fix-temp.yml
          git add src/source-simulator.js tests/browser-smoke.spec.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: show LeKiwi from true front"
          git push origin HEAD:main
